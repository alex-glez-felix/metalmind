[graph]
exclude-dev = true

[advisories]
version = 2
# Las vulnerabilidades se revisan en todo el árbol. "Sin mantenimiento" solo en
# lo que el workspace usa directo: el resto viene de GPUI y no lo elegimos.
unmaintained = "workspace"

[licenses]
version = 2
# Todas compatibles con GPL-3.0; MPL-2.0 lo es por su §3.3.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
