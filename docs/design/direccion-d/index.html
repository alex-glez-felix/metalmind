<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metalmind · cuatro direcciones de UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============ página (fuera de los mockups) ============ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--pg-bg);color:var(--pg-text);-webkit-font-smoothing:antialiased}
body.pg-oscuro{--pg-bg:#0c0d0f;--pg-bar:#121316;--pg-text:#d8dbe0;--pg-muted:#8a9099;--pg-border:#24262b;--pg-btn:#1a1c20;--pg-on:#e8ebf0;--pg-on-text:#111}
body.pg-claro{--pg-bg:#ebebe8;--pg-bar:#f7f7f5;--pg-text:#24272c;--pg-muted:#6b717a;--pg-border:#d6d6d2;--pg-btn:#ffffff;--pg-on:#24272c;--pg-on-text:#fff}
#top{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;min-height:48px;padding:7px 16px;background:var(--pg-bar);border-bottom:1px solid var(--pg-border)}
#top .brand{font-weight:700;letter-spacing:.02em;font-size:14px;margin-right:4px}
#top .brand small{font-weight:400;color:var(--pg-muted);margin-left:6px}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:0;border:1px solid var(--pg-border);border-radius:4px;overflow:hidden}
.seg .lbl{font-size:11px;color:var(--pg-muted);padding:0 8px;text-transform:uppercase;letter-spacing:.06em}
.seg button{font:inherit;font-size:12.5px;border:0;border-left:1px solid var(--pg-border);background:var(--pg-btn);color:var(--pg-text);padding:6px 10px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--pg-on);color:var(--pg-on-text)}
.seg button kbd{font-family:"JetBrains Mono",monospace;font-size:10px;opacity:.55;margin-left:5px}
#top .hint{font-size:11.5px;color:var(--pg-muted);margin-left:auto}
#stagewrap{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
#stage{min-width:1200px;height:calc(100vh - 49px);min-height:660px;position:relative}
#about{max-width:1180px;margin:0 auto;padding:28px 20px 60px;line-height:1.6;font-size:15px}
#about h2{font-size:22px;margin:0 0 4px}
#about .tag{color:var(--pg-muted);font-size:13px;margin-bottom:14px}
#about h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--pg-muted);margin:22px 0 6px}
#about p{margin:0 0 10px}
#about ul{margin:4px 0 10px;padding-left:20px}
#about table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:6px}
#about th,#about td{border:1px solid var(--pg-border);padding:6px 9px;text-align:left;vertical-align:top}
#about th{background:var(--pg-bar);font-weight:600}
#about tr.cur td{background:color-mix(in srgb,var(--pg-on) 9%,transparent)}
#about code{font-family:"JetBrains Mono",monospace;font-size:.88em;background:var(--pg-bar);border:1px solid var(--pg-border);padding:0 4px;border-radius:3px}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
@media (max-width:1560px){#top .hint{display:none}#top .brand small{display:none}.seg .lbl{display:none}.seg button{padding:6px 8px}}
@media (max-width:860px){.cols{grid-template-columns:1fr}#top .hint{display:none}#stage{height:720px}}

/* ============ base común de los mockups ============ */
.app{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:var(--ui-size,13px);line-height:1.4;container-type:inline-size}
.app svg.i{width:var(--icon,14px);height:var(--icon,14px);flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app .mono{font-family:var(--mono)}
.app kbd{font-family:var(--mono);font-size:.86em;color:var(--muted);border:1px solid var(--border);border-radius:3px;padding:0 4px;background:var(--surface)}
.app .faint{color:var(--faint)} .app .muted{color:var(--muted)}

/* Un solo tema para las cuatro: metalmind-oscuro / metalmind-claro de crates/metalmind-config/themes/ */
.app{--ui:Inter,system-ui,sans-serif;--mono:"JetBrains Mono",monospace;--ed:"JetBrains Mono",monospace;--ed-size:14.5px;--ed-lh:1.6;--ui-size:13px;--row-h:26px;--indent:14px}
.app.th-oscuro{--bg:#1c1f24;--surface:#16181d;--raised:#21252b;--text:#d7dae0;--muted:#9aa0a6;--faint:#5c6370;--inactive:#5c6370;--border:#2a2e36;--border-strong:#3b414c;--pane:#5c6370;
 --accent:#7aa2f7;--accent-text:#16181d;--sel:rgba(122,162,247,.3);--sel-soft:rgba(122,162,247,.2);--active:rgba(215,218,224,.08);--hover:#21252b;--link:#7dcfff;--link-unres:#ff9e64;
 --codebg:#16181d;--inlinecode:#21252b;--code-fg:#e0af68;--caret:rgba(122,162,247,.5);--caret-text:#d7dae0;--curline:#21252b;--markup:#4b5263;--quote:#9aa0a6;--list:#7aa2f7;--fm-key:#7aa2f7;
 --syn-kw:#bb9af7;--syn-ty:#e0af68;--syn-st:#9ece6a;--syn-fn:#7aa2f7;--warn:#e0af68;--danger:#f7768e;--saved:#5c6370;--match:#ff9e64;
 --g-edge:#2a2e36;--g-parent:#5c6370;--g-link:rgba(122,162,247,.55);--g-note:#9aa0a6;
 --c-naranja:#ff9e64;--c-azul:#7aa2f7;--c-violeta:#bb9af7;--c-verde:#9ece6a;--c-amarillo:#e0af68;--c-gris:#5c6370;--c-cian:#7dcfff;--c-rojo:#f7768e;--c-ninguno:#9aa0a6}
.app.th-claro{--bg:#f5f6f8;--surface:#e6e8ec;--raised:#eceef2;--text:#2b2f36;--muted:#5f6670;--faint:#8a909a;--inactive:#8a909a;--border:#d2d6dc;--border-strong:#b9bec6;--pane:#8a909a;
 --accent:#2e5cd6;--accent-text:#fff;--sel:rgba(46,92,214,.2);--sel-soft:rgba(46,92,214,.14);--active:rgba(43,47,54,.07);--hover:#eceef2;--link:#0f7a99;--link-unres:#b35a00;
 --codebg:#eceef2;--inlinecode:#e6e8ec;--code-fg:#b35a00;--caret:rgba(46,92,214,.4);--caret-text:#2b2f36;--curline:#eceef2;--markup:#a0a6b0;--quote:#5f6670;--list:#2e5cd6;--fm-key:#2e5cd6;
 --syn-kw:#8a3fc4;--syn-ty:#8f6400;--syn-st:#3f7a1e;--syn-fn:#2e5cd6;--warn:#8f6400;--danger:#c4304f;--saved:#8a909a;--match:#b35a00;
 --g-edge:#d2d6dc;--g-parent:#8a909a;--g-link:rgba(46,92,214,.5);--g-note:#5f6670;
 --c-naranja:#b35a00;--c-azul:#2e5cd6;--c-violeta:#8a3fc4;--c-verde:#3f7a1e;--c-amarillo:#8f6400;--c-gris:#8a909a;--c-cian:#0f7a99;--c-rojo:#c4304f;--c-ninguno:#5f6670}

/* árbol */
.tree{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:var(--row-gap,7px);height:var(--row-h,26px);padding:0 10px 0 calc(10px + var(--d,0) * var(--indent,14px));white-space:nowrap;overflow:hidden;color:var(--text);cursor:default;border:1px solid transparent}
.row .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row .cnt{color:var(--faint);font-variant-numeric:tabular-nums;font-size:.92em}
.row .tw{width:10px;color:var(--faint);flex:none;text-align:center;font-size:9px}
.row.note .nm{color:var(--muted)}
.row.more .nm{color:var(--faint);font-style:italic}
.row.active{background:var(--active);border-color:var(--sel-border,transparent)}
.row.active .nm{color:var(--text)}
.row.cursor{background:var(--sel);border-color:transparent}
.row .multi{font-size:10.5px;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tc);flex:none}
.hash{color:var(--tc);font-family:var(--mono);font-weight:600;flex:none;width:10px;text-align:center}
.emo{font-size:12px;flex:none;width:14px;text-align:center;line-height:1}
.row.inbox .nm{color:var(--text)}

/* editor */
.ed{font-family:var(--ed);font-size:var(--ed-size,14.5px);line-height:var(--ed-lh,1.6);color:var(--text)}
.ln{display:flex;min-height:calc(var(--ed-size,14.5px) * var(--ed-lh,1.6))}
.ln .gut{width:var(--gut-w,38px);flex:none;text-align:right;padding-right:14px;color:var(--faint);font-family:var(--mono);font-size:.84em;user-select:none;font-variant-numeric:tabular-nums;padding-top:.18em}
.ln.is-cur .gut{color:var(--muted)}
.ln.is-cur{background:var(--curline,transparent)}
.ln .tx{white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden;flex:1;min-width:0}
.ln.l-code .tx{white-space:pre;overflow-wrap:normal}
.ln.l-h1 .tx{font-size:1.6em;font-weight:700;line-height:1.35;padding:.25em 0 .1em}
.ln.l-h2 .tx{font-size:1.22em;font-weight:650;padding-top:.45em}
.ln.l-h1 .gut,.ln.l-h2 .gut{padding-top:.75em}
.ln.l-fm .tx{color:var(--muted);font-family:var(--mono);font-size:.86em}
.ln.l-code{background:var(--codebg)}
.ln.l-code .tx{font-family:var(--mono);font-size:.88em;padding-left:12px}
.ln.l-quote .tx{border-left:2px solid var(--border-strong);padding-left:12px;color:var(--quote);font-style:italic}
.md-mark{color:var(--markup)}
.md-code{font-family:var(--mono);font-size:.9em;color:var(--code-fg);background:var(--inlinecode);padding:0 3px;border-radius:3px}
.md-link{color:var(--link);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--link) 40%,transparent);text-underline-offset:3px}
.md-tag{color:var(--tc)}
.md-bullet{color:var(--list)}
.fm-chip{display:inline-block;font-family:var(--ui);font-size:.82em;padding:0 6px;margin-right:5px;border-radius:3px;color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent);line-height:1.6}
.kw{color:var(--syn-kw)} .ty{color:var(--syn-ty)} .st{color:var(--syn-st)} .cm{color:var(--faint);font-style:italic} .fnn{color:var(--syn-fn)}
.cur{background:var(--caret);color:var(--caret-text);border-radius:1px}

/* picker / finder */
.picker{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--pk-radius,8px);overflow:hidden;box-shadow:var(--pk-shadow,none)}
.pk-in{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:14px}
.pk-in .q-tag{color:var(--tc)}
.pk-in .q-neg{color:var(--faint);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--faint) 60%,transparent)}
.pk-in .caretbar{display:inline-block;width:2px;height:17px;background:var(--accent);vertical-align:-3px;margin-left:1px}
.pk-in .scope{margin-left:auto;font-family:var(--ui);font-size:11.5px;color:var(--muted)}
.pk-row{display:flex;align-items:center;gap:10px;padding:6px 14px;white-space:nowrap}
.pk-row .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:13px;color:var(--muted)}
.pk-row .p b{color:var(--accent);font-weight:700}
.pk-row .p .fn{color:var(--text)}
.pk-row.on{background:var(--sel-soft)}
.pk-row .chips{display:flex;gap:5px;flex:none}
.chip{font-size:11px;padding:0 6px;border-radius:3px;color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);line-height:18px;white-space:nowrap}
.pk-foot{display:flex;gap:14px;padding:7px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}
.pk-foot span:first-child{margin-right:auto}

/* grafo */
.graph{display:block;width:100%;height:100%}
.graph .e{stroke:var(--g-edge);stroke-width:1}
.graph .e.parent{stroke:var(--g-parent);stroke-width:1.4;stroke-dasharray:4 3}
.graph .e.link{stroke:var(--g-link);stroke-width:1.2}
.graph .e.dim{opacity:.14}
.graph .n-note{fill:var(--g-note)}
.graph .n-tag{fill:var(--tc);fill-opacity:var(--g-tag-fill,.9);stroke:var(--tc);stroke-width:1.5}
.graph .n-inbox{fill:none;stroke:var(--faint);stroke-dasharray:3 3;stroke-width:1.3}
.graph .dim{opacity:.16}
.graph .hl.n-note{fill:var(--text)}
.graph .sel{fill:none;stroke:var(--accent);stroke-width:2}
.graph text{font-family:var(--g-font,var(--ui));font-size:var(--g-fs,11px);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.graph text.t{fill:var(--text);font-weight:600;font-size:var(--g-tfs,12px)}
.graph text.t.dim{opacity:.3}

/* =====================================================================
   A · Silencio  (Zed / iA Writer)
   ===================================================================== */
.dir-A{--gut-w:52px}
.A-grid{position:absolute;inset:0;display:grid;grid-template-columns:248px 1fr;grid-template-rows:1fr 28px}
.A-side{background:var(--surface);border-right:1px solid var(--border);overflow:hidden;padding-top:10px}
.A-head{display:flex;align-items:center;justify-content:space-between;padding:0 12px 6px 20px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.A-head .sw{display:flex;gap:10px;text-transform:none;letter-spacing:0;font-size:11.5px}
.A-head .sw .on{color:var(--text)}
.A-side .row{padding-left:calc(14px + var(--d,0) * 14px)}
.A-sep{height:1px;background:var(--border);margin:8px 14px}
.A-views .row .q{font-family:var(--mono);font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis}
.A-main{position:relative;overflow:hidden}
.A-crumb{position:absolute;top:12px;right:22px;font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.A-col{max-width:760px;margin:0 auto;padding:46px 24px 0 0;--gut-w:52px}
.A-back{margin:26px 0 0 52px;padding-top:14px;border-top:1px solid var(--border)}
.A-back h4{margin:0 0 10px;font-weight:500;font-size:12px;color:var(--faint);letter-spacing:.02em}
.A-bl{padding:5px 0 7px;font-size:13px}
.A-bl .t{color:var(--text)} .A-bl .t small{color:var(--faint);font-family:var(--mono);font-size:11px;margin-left:8px}
.A-bl .c{color:var(--muted);font-family:var(--ed);font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.A-bl .c em{font-style:normal;color:var(--link)}
.A-status{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 14px 0 20px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);white-space:nowrap}
.A-status .mode{color:var(--accent);font-weight:600;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
.A-status .sp{margin-left:auto}
.A-status .ok{color:var(--saved)}
.A-status .fc{color:var(--warn);font-family:var(--mono);font-size:11.5px}
.A-graph{position:absolute;inset:0}
.A-graph .cap{position:absolute;left:24px;top:18px;font-size:12px;color:var(--muted)}
.A-graph .cap b{color:var(--text);font-weight:600}
.A-graph .keys{position:absolute;left:24px;bottom:16px;font-size:11.5px;color:var(--faint);display:flex;gap:14px}
.dir-A .picker{left:50%;transform:translateX(-50%);top:70px;width:min(700px,70%)}

/* =====================================================================
   B · Taller  (IDE denso, docks)
   ===================================================================== */
.dir-B{--icon:15px;--gut-w:44px}
.B-grid{position:absolute;inset:0;display:grid;grid-template-columns:40px 272px 1fr 318px;grid-template-rows:1fr 24px}
.B-act{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:2px}
.B-act .ab{width:30px;height:30px;display:grid;place-items:center;color:var(--faint);border-radius:4px;position:relative}
.B-act .ab.on{color:var(--text);background:color-mix(in srgb,var(--accent) 18%,transparent)}
.B-act .ab .k{position:absolute;right:-1px;bottom:0;font-size:8px;font-family:var(--mono);color:var(--faint)}
.B-act .grow{flex:1}
.B-side{background:var(--surface);border-right:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.B-sec{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--border)}
.B-sec:first-child{border-top:0}
.B-sec .k{margin-left:auto;font-weight:400;letter-spacing:0;text-transform:none}
.B-sec .chev{font-size:9px;color:var(--faint);width:9px}
.B-filter{margin:4px 8px 4px;display:flex;align-items:center;gap:6px;height:24px;padding:0 7px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--faint);font-family:var(--mono);font-size:11.5px}
.B-views .row .q{font-family:var(--mono);font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;max-width:120px}
.B-focus{margin-top:auto;border-top:1px solid var(--border);padding:7px 10px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--warn);font-family:var(--mono);white-space:nowrap}
.B-focus .x{margin-left:auto;color:var(--faint)}
.B-main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.B-tabs{display:flex;height:33px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.B-tab{display:flex;align-items:center;gap:7px;padding:0 12px;border-right:1px solid var(--border);color:var(--muted);white-space:nowrap;font-size:12.5px}
.B-tab.on{background:var(--bg);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.B-tab .dotm{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.B-tab .x{color:var(--faint);font-size:11px}
.B-tabs .tail{margin-left:auto;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--faint)}
.B-panes{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.B-pane{overflow:hidden;min-width:0;position:relative;padding-top:8px}
.B-pane + .B-pane{border-left:2px solid var(--pane)}
.B-pane.inactive .ln .tx{opacity:.96}
.B-crumbs{display:flex;align-items:center;gap:5px;height:24px;padding:0 12px;font-size:11.5px;color:var(--faint);border-bottom:1px solid var(--border);margin-top:-8px;margin-bottom:8px;white-space:nowrap;overflow:hidden}
.B-crumbs b{color:var(--muted);font-weight:500}
.B-tagview{padding:0 18px}
.B-tagview .hd{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.B-tagview .hd .big{font-size:22px;font-weight:700;color:var(--tc)}
.B-tagview .meta{display:grid;grid-template-columns:70px 1fr;gap:3px 10px;font-size:12px;margin:10px 0 12px}
.B-tagview .meta span:nth-child(odd){color:var(--faint)}
.B-tagview .desc{font-family:var(--ed);font-size:13px;line-height:1.6;color:var(--text);border-left:2px solid var(--tc);padding:2px 0 2px 10px;margin-bottom:14px}
.B-tagview h5{margin:0 0 4px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.B-nl{display:grid;grid-template-columns:1fr auto;gap:0 10px;font-size:12.5px}
.B-nl div{padding:4px 0;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.B-nl .d{color:var(--faint);font-family:var(--mono);font-size:11px}
.B-dock{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.B-dtabs{display:flex;height:33px;border-bottom:1px solid var(--border);flex:none}
.B-dtabs div{display:flex;align-items:center;gap:6px;padding:0 11px;color:var(--muted);font-size:12px;white-space:nowrap}
.B-dtabs div.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
.B-dtabs .n{color:var(--faint);font-size:11px}
.B-bl{padding:7px 12px;border-bottom:1px solid var(--border)}
.B-bl .t{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text);white-space:nowrap}
.B-bl .t small{margin-left:auto;color:var(--faint);font-family:var(--mono);font-size:10.5px}

/* ===================================================================

   =================================================================== */
function mk(x,cur){return cur?`<span class="md-mark">${esc(x)}</span>`:''}
function inline(s,cur){
  const re=/(`[^`]+`)|(\*\*[^*]+\*\*)|(\*[^*\s][^*]*\*)|(\[\[[^\]]+\]\])|((?<=^|\s)#[\p{L}\d_-]+)/gu;
  let out='',last=0;
  for(const m of s.matchAll(re)){
    out+=esc(s.slice(last,m.index)); const t=m[0];
    if(m[1]) out+=mk('`',cur)+`<span class="md-code">${esc(t.slice(1,-1))}</span>`+mk('`',cur);
    else if(m[2]) out+=mk('**',cur)+`<b>${esc(t.slice(2,-2))}</b>`+mk('**',cur);
    else if(m[3]) out+=mk('*',cur)+`<i>${esc(t.slice(1,-1))}</i>`+mk('*',cur);
    else if(m[4]) out+=mk('[[',cur)+`<span class="md-link">${esc(t.slice(2,-2))}</span>`+mk(']]',cur);
    else if(m[5]) out+=`<span class="md-tag" style="${tc(t.slice(1).toLowerCase())}">${esc(t)}</span>`;
    last=m.index+t.length;
  }
  return out+esc(s.slice(last));
}
function rust(s){
  let h=esc(s);
  if(/^\s*\/\//.test(s)) return `<span class="cm">${h}</span>`;
  h=h.replace(/\b(fn|mut|impl|let|self|pub|use|struct)\b/g,'<span class="kw">$1</span>')
     .replace(/\b([A-Z][A-Za-z]+)\b/g,'<span class="ty">$1</span>')
     .replace(/\b([a-z_]+)(?=\()/g,'<span class="fnn">$1</span>');
  return h;
}
function lines(src, cur, opt={}){
  const out=[]; let inFm=false, inCode=false;
  src.forEach((s,i)=>{
    const isCur=i===cur; let cls='', html='';
    if(i===0 && s==='---'){inFm=true; cls='l-fm'; html=isCur?'---':'<span class="md-mark">---</span>';}
    else if(inFm){
      cls='l-fm';
      if(s==='---'){inFm=false; html='<span class="md-mark">---</span>';}
      else if(!isCur && /^tags:/.test(s) && opt.chips!==false){
        const ts=s.replace(/^tags:\s*\[|\]$/g,'').split(',').map(x=>x.trim());
        html='<span style="color:var(--fm-key)">tags</span>&nbsp;&nbsp;'+ts.map(t=>`<span class="fm-chip" style="${tc(t)}">${esc(t)}</span>`).join('');
      } else html=esc(s);
    }
    else if(s.startsWith('```')){
      inCode=!inCode; cls='l-code';
      html = isCur ? esc(s) : `<span class="md-mark">${inCode?esc(s.slice(3)):''}</span>`;
    }
    else if(inCode){cls='l-code'; html=rust(s);}
    else if(/^#{1,6} /.test(s)){const n=s.indexOf(' '); cls='l-h'+n; html=mk(s.slice(0,n+1),isCur)+inline(s.slice(n+1),isCur);}
    else if(s.startsWith('- ')){html=(isCur?'<span class="md-mark">- </span>':'<span class="md-bullet">•&nbsp;</span>')+inline(s.slice(2),isCur);}
    else if(s.startsWith('> ')){cls='l-quote'; html=mk('> ',isCur)+inline(s.slice(2),isCur);}
    else html=inline(s,isCur);
    html=html.replace(/\u0001(&[a-z]+;|<[^>]+>|.)/u,'<span class="cur">$1</span>');
    out.push({cls,html,isCur,i});
  });
  return out;
}
function editorHTML(o={}){
  const src=o.src||SRC, cur=o.cur??CUR;
  const L=lines(src,cur,o);

    const num = o.numbers===false ? '' : (l.isCur? (l.i+1) : Math.abs(l.i-cur));
    return `<div class="ln ${l.cls} ${l.isCur?'is-cur':''}"><span class="gut">${num}</span><span class="tx">${l.html||' '}</span></div>`;
  }).join('')+`</div>`;
}

function hl(path, word){

/* ===================================================================
   grafo: layout de fuerzas propio, determinista, en SVG
   =================================================================== */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const GCACHE={};
function graphModel(sub){
  const key=sub?[...sub].sort().join(','):'all';
  if(GCACHE[key]) return GCACHE[key];
  const nodes=[], edges=[], seen=new Set();
  const want=id=>!sub||sub.has(id);
  for(const k in TAGS) if(want('t:'+k)) nodes.push({id:'t:'+k,type:'tag',k,count:TAGS[k].count});
  const anyInbox = NOTES.some(n=>!n.tags.length && want(n.id));
  if(anyInbox && want('inbox')) nodes.push({id:'inbox',type:'inbox'});
  for(const n of NOTES) if(want(n.id)) nodes.push({id:n.id,type:'note',n});
  const has=new Set(nodes.map(n=>n.id));
  const add=(a,b,type)=>{const kk=[a,b].sort().join('|')+type; if(has.has(a)&&has.has(b)&&!seen.has(kk)){seen.add(kk);edges.push({a,b,type})}};
  for(const k in TAGS) for(const p of TAGS[k].parents) add('t:'+k,'t:'+p,'parent');
  for(const n of NOTES){ for(const t of n.tags) add(n.id,'t:'+t,'tag'); for(const l of n.links) add(n.id,l,'link'); if(!n.tags.length) add(n.id,'inbox','tag'); }
  // fuerzas
  const r=rng(sub?7:3); const ix=new Map(nodes.map((n,i)=>[n.id,i]));
  nodes.forEach(n=>{n.x=r()-.5;n.y=r()-.5;n.vx=0;n.vy=0});
  const N=nodes.length;
  for(let it=0;it<700;it++){
    const a=1-it/700*.9;
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
      const A=nodes[i],B=nodes[j]; let dx=A.x-B.x, dy=A.y-B.y; let d2=dx*dx+dy*dy+1e-4;
      const w=(A.type==='tag'?1.8:1)*(B.type==='tag'?1.8:1);
      const f=0.0013*w/d2*a; const d=Math.sqrt(d2);
      A.vx+=dx/d*f; A.vy+=dy/d*f; B.vx-=dx/d*f; B.vy-=dy/d*f;
    }
    for(const e of edges){
      const A=nodes[ix.get(e.a)],B=nodes[ix.get(e.b)]; let dx=B.x-A.x, dy=B.y-A.y; const d=Math.sqrt(dx*dx+dy*dy)+1e-6;
      const L=e.type==='parent'?0.2:e.type==='link'?0.17:0.11; const f=(d-L)*0.06*a;
      A.vx+=dx/d*f; A.vy+=dy/d*f; B.vx-=dx/d*f; B.vy-=dy/d*f;
    }
    for(const n of nodes){ n.vx-=n.x*0.012*a; n.vy-=n.y*0.012*a; n.vx*=.82; n.vy*=.82; n.x+=Math.max(-.03,Math.min(.03,n.vx)); n.y+=Math.max(-.03,Math.min(.03,n.vy)); }
  }
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  nodes.forEach(n=>{x0=Math.min(x0,n.x);x1=Math.max(x1,n.x);y0=Math.min(y0,n.y);y1=Math.max(y1,n.y)});
  nodes.forEach(n=>{n.u=(n.x-x0)/(x1-x0||1);n.v=(n.y-y0)/(y1-y0||1)});
  return GCACHE[key]={nodes,edges,ix};
}
const GSLOTS=[];
function graphSVG(o){
  if(!o.measured){GSLOTS.push(o);return `<div class="gslot" data-g="${GSLOTS.length-1}" style="width:100%;height:100%"></div>`}
  const {w,h}=o, pad=o.pad||[60,40], M=graphModel(o.sub);
  const X=n=>pad[0]+n.u*(w-2*pad[0]), Y=n=>pad[1]+n.v*(h-2*pad[1]);
  const hlset=o.hl, isHl=id=>!hlset||hlset.has(id);
  let s=`<svg class="graph" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">`;
  for(const e of M.edges){
    const A=M.nodes[M.ix.get(e.a)],B=M.nodes[M.ix.get(e.b)];
    const dim=hlset&&!(isHl(e.a)&&isHl(e.b));
    s+=`<line class="e ${e.type} ${dim?'dim':''}" x1="${X(A).toFixed(1)}" y1="${Y(A).toFixed(1)}" x2="${X(B).toFixed(1)}" y2="${Y(B).toFixed(1)}"/>`;
  }
  const scale=o.scale||1, labels=[], boxes=[], fs=o.fs||11.5;
  // etiquetas sin encimarse: se prueba arriba/abajo (tags) o derecha/izquierda (notas) y si no cabe, no se pone
  const place=(cands,txt,cls,w,hh)=>{
    for(const [x,y,anchor] of cands){
      const bx = anchor==='middle'? x-w/2 : anchor==='end'? x-w : x;
      const b=[bx-2,y-hh,bx+w+2,y+3];
      if(b[0]<2||b[2]>o.w-2) continue;
      if(!boxes.some(q=>!(b[2]<q[0]||b[0]>q[2]||b[3]<q[1]||b[1]>q[3]))){boxes.push(b);labels.push(`<text class="${cls}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anchor}">${txt}</text>`);return true}
    } return false;
  };
  const order=[...M.nodes].sort((a,b)=>(b.type==='tag')-(a.type==='tag')||(b.id===o.sel)-(a.id===o.sel));
  for(const n of M.nodes){ const x=X(n),y=Y(n);
    if(n.type==='tag'){ const r=(3.5+Math.sqrt(n.count)*1.05)*scale; boxes.push([x-r,y-r,x+r,y+r]); }
    else boxes.push([x-4,y-4,x+4,y+4]);
  }
  for(const n of M.nodes){
    const x=X(n).toFixed(1), y=Y(n).toFixed(1), dim=!isHl(n.id)?'dim':'hl';
    if(n.type==='tag'){
      const r=(3.5+Math.sqrt(n.count)*1.05)*scale;
      s+=`<circle class="n-tag ${dim}" style="${tc(n.k)}" cx="${x}" cy="${y}" r="${r.toFixed(1)}"/>`;
    } else if(n.type==='inbox'){
      s+=`<circle class="n-inbox" cx="${x}" cy="${y}" r="${(9*scale).toFixed(1)}"/>`;
    } else {
      const r=(n.id===o.sel?5:3.3)*scale;
      s+=`<circle class="n-note ${dim}" cx="${x}" cy="${y}" r="${r}"/>`;
      if(n.id===o.sel) s+=`<circle class="sel" cx="${x}" cy="${y}" r="${(r+5).toFixed(1)}"/>`;
    }
  }
  if(o.labels!=='none') for(const n of order){
    const x=X(n), y=Y(n), dim=!isHl(n.id)?'dim':'';
    if(n.type==='tag'){
      const r=(3.5+Math.sqrt(n.count)*1.05)*scale, txt=(o.hashLabels?'#':'')+esc(TAGS[n.k].name), w=txt.length*fs*.62;
      place([[x,y-r-5,'middle'],[x,y+r+fs+2,'middle'],[x+r+4,y+4,'start']],txt,'t '+dim,w,fs+1);
    } else if(n.type==='inbox'){
      place([[x,y-13*scale,'middle'],[x,y+13*scale+fs,'middle']],'Sin tags',hlset&&!isHl('inbox')?'dim':'',8*fs*.55,fs);
    } else {
      const showL = o.labels==='all' || (o.labels==='hl' && hlset && hlset.has(n.id)) || n.id===o.sel;
      if(!showL) continue;
      const txt=esc(n.n.t), w=n.n.t.length*fs*.53;
      place([[x+9,y+4,'start'],[x-11,y+4,'end'],[x,y-8,'middle'],[x,y+fs+6,'middle']],txt,dim,w,fs);
    }
  }
  return s+labels.join('')+`</svg>`;
}

function foldersDim(o={}){
  return `<div class="tree">`+FOLDERS.map((r,i)=>{
    const tw=`<span class="tw">${r.dir?(r.open?'▾':'▸'):''}</span>`;
    const cls=[r.dir?'':'note',r.active?'active':'',o.dim&&FDIM.has(i)?'dimf':'',o.cursor===i?'cursor':''].join(' ');
    return `<div class="row ${cls}" style="--d:${r.d}">${tw}${I(r.dir?'folder':'file')}<span class="nm">${esc(r.n)}${r.dir?'/':''}${r.hint?` <span class="faint">· ${r.hint}</span>`:''}</span>${r.c!==undefined?`<span class="cnt">${r.c}</span>`:''}</div>`;
  }).join('')+`</div>`;
}
function renderA1(){
  const side=`<div class="A1-seg"><span>Tags</span><span class="on">Carpetas</span><kbd>T</kbd></div>
    ${foldersDim({dim:1})}
    <div class="A1-note">Atenuadas: sin notas en el focus <span class="q-tag" style="${tc('rust')};color:var(--tc)">#rust</span> <span class="mono">-#archivado</span></div>`;
  return `<div class="A-grid"><aside class="A-side">${side}</aside><main class="A-main">${aNote()}</main>
    ${aStatus('<kbd>T</kbd> tags/carpetas · <kbd>space f</kbd> buscar · <kbd>space g</kbd> grafo')}</div>`;
}
function renderA2(){
  const side=`<div class="A-head"><span>Vistas</span></div><div class="A-views">${viewsList({tw:false,icon:false})}</div><div class="A-sep"></div>
    <div class="A-head"><span>Tags</span><span class="sw"><span>carpetas <kbd>space e</kbd></span></span></div>${tagTree({style:'dot',cursor:false})}`;
  const crumb=`<div class="A2-crumb"><span class="s">proyectos</span><span class="faint">/</span><span class="s on">metalmind</span><span class="faint">/</span><span class="f">gpui-render-loop.md</span><span class="k"><kbd>space e</kbd> árbol</span></div>`;
  const tree=`<div class="picker A2-tree"><div class="pk-in">${I('folder')}<span class="lab">carpetas</span><span class="pth">proyectos/metalmind/</span><span class="caretbar"></span><span class="scope">131 notas · 12 carpetas</span></div>
    ${foldersDim({cursor:13})}
    <div class="pk-foot"><span>escribe para filtrar</span><span><kbd>h</kbd><kbd>l</kbd> plegar</span><span><kbd>enter</kbd> abrir</span><span><kbd>ctrl-v</kbd> split</span><span><kbd>esc</kbd></span></div></div>`;
  return `<div class="A-grid"><aside class="A-side">${side}</aside><main class="A-main">${aNote({crumb:false,colStyle:'padding-top:22px',pre:crumb})}${tree}</main>
    ${aStatus('<kbd>space e</kbd> carpetas · <kbd>space f</kbd> buscar · <kbd>space g</kbd> grafo')}</div>`;
}

Object.assign(DIRS,{
 D1:{name:'D1 · Split',sub:'D con dos notas lado a lado (ctrl-w v), sin volverse un IDE',render:renderD1,variant:1,base:'D',
  phil:`Abrir una segunda nota desde la lista con <code>ctrl-v</code> (o <code>ctrl-w v</code> desde la nota) parte la zona de la nota en dos, como en vim. Para hacer sitio, la columna de fuentes desaparece: la fuente se vuelve el título de la lista («rust vivo ▾», <code>space v</code> para cambiarla). Cada panel lleva una sola cabecera de una línea con su ruta y una franja de backlinks plegada; no hay pestañas ni docks. El panel activo se distingue por la línea bajo la cabecera y por el texto a opacidad completa; el otro se atenúa un poco. En la lista, un número chico dice en qué panel está abierta cada nota. A 1280 la lista se pliega a una tira de íconos de 40 px (<code>ctrl-w h</code> la despliega) y cada nota queda en unos 620 px.`,
  pros:['Es el modelo de ventanas de vim que ya usas: <code>ctrl-w v/s/o/h/l</code>, nada que aprender.','Comparar o copiar entre dos notas (la lectura y la nota técnica) sin perder la lista.','Sigue callado: cero pestañas, una cabecera por panel, lo demás es texto.'],
  cons:['A 1920 con la lista abierta cada nota tiene unos 780 px: alcanza, pero no hay sitio para un tercer panel.','Dos cursores: hay que decidir qué panel recibe el <code>enter</code> de la lista (aquí, el activo).','<code>ctrl-w s</code> (arriba/abajo) con notas largas deja mitades cortas; es mejor para notas breves.'],
  cost:`<b>Medio-bajo si D ya existe.</b> Los splits de <code>ctrl-w</code> ya están en el repo. Lo nuevo: (1) el layout que, en <code>render</code>, lee <code>window.bounds()</code> y elige lista completa o tira; (2) a qué panel va el <code>enter</code> de la lista y el número de panel en cada fila; (3) la franja de backlinks por panel, que es el bloque al pie de A en versión de una línea. No hay docks ni pestañas: en <code>ui.yaml</code> solo se guarda el ancho de la lista.`},
 D2:{name:'D2 · Contexto',sub:'lista estrecha + una nota + panel de backlinks y grafo local que solo aparece al pedirlo',render:renderD2,variant:1,base:'D',
  phil:`La lista se estrecha a títulos de una línea (sin extracto), con los tags como puntos, y absorbe la columna de fuentes en su título. La nota se queda con el centro. A la derecha, el panel de contexto —enlazan aquí, salientes y el grafo local a un salto— solo existe mientras lo pides con <code>space b</code>; cerrado, la nota vuelve a su franja de backlinks de una línea. <code>space l</code> pliega la lista. A 1280 la lista ya arranca plegada como tira de íconos (vista, buscar, tags, buzón) y el contexto queda en 330 px.`,
  pros:['La nota manda y el contexto no estorba: aparece cuando estás conectando ideas y se va con <code>esc</code>.','El grafo local entra sin pagar el grafo grande: 10–20 nodos alrededor de la nota.','La lista de una línea muestra 25 notas a la vez: buena para vaciar el buzón con <code>j</code>/<code>k</code>/<code>t</code>.'],
  cons:['Pierde el extracto de cada nota en la lista, que era lo especial de D (se puede volver con un modo «lista ancha»).','El panel de contexto es lo más parecido a un dock: si se deja abierto siempre, la ventana se vuelve B.','En 380 px, con 20 backlinks y el grafo, el panel necesita scroll.'],
  cost:`<b>Medio.</b> La lista de una línea es la misma <code>uniform_list</code> con filas de 30 px, y más barata que la de D: no necesita extractos en el índice. El panel de contexto es una columna opcional con un booleano en el estado de la ventana. El grafo local es el elemento propio de A (<code>paint_quad</code> + <code>PathBuilder</code>) con un layout de fuerzas tan chico que se puede calcular en el mismo frame; es la pieza más cara y se puede posponer dejando solo los backlinks.`},
 A1:{name:'A1 · Tags | Carpetas',sub:'A con un segmento en el panel lateral para alternar el árbol',render:renderA1,variant:1,base:'A',
  phil:`El panel lateral de A lleva arriba un segmento de dos opciones, Tags | Carpetas, que hace lo mismo que la <code>T</code> de hoy pero dice en qué modo estás. En Carpetas el árbol revela la nota abierta (<code>proyectos/metalmind/gpui-render-loop.md</code>) y atenúa las carpetas sin nada dentro del focus, para que el focus siga mandando aunque cambies de árbol. Las vistas guardadas se quedan en el modo Tags. Lo demás no cambia: la nota sigue sola en su columna, con los backlinks al pie.`,
  pros:['Es lo que ya existe (<code>T</code>) con una etiqueta visible: casi gratis y más fácil de descubrir.','Un panel, una columna de nota: A no pierde el silencio.','Las carpetas atenuadas por focus hacen que el focus no se rompa al cambiar de árbol.'],
  cons:['Sigue siendo uno u otro: no ves a la vez los tags y la carpeta de una nota.','El segmento es cromo, aunque chico, arriba del panel.','Hay que decidir si el modo se recuerda por vault o por sesión.'],
  cost:`<b>Bajo.</b> Los dos árboles ya existen; quedan detrás de un <code>enum</code> en el estado del panel. El segmento son dos <code>div</code> con <code>on_click</code> más la <code>T</code> que ya hay. Revelar la nota abierta es expandir sus ancestros y llamar <code>scroll_to_item</code> en la <code>uniform_list</code>. Atenuar por focus sale del conjunto que el focus ya calcula. El modo se guarda en <code>ui.yaml</code>.`},
 A2:{name:'A2 · Migas + árbol en overlay',sub:'A sin modo carpetas en el panel: ruta navegable sobre la nota y el árbol en space e',render:renderA2,variant:1,base:'A',
  phil:`El panel lateral se queda con Vistas y Tags y nada más. Las carpetas aparecen de dos formas: la ruta de la nota, arriba del título, es una miga de pan donde cada carpeta se abre (clic, o <code>space e</code> desde la carpeta de la nota); y el árbol completo vive en un overlay con forma de picker, que se abre ya desplegado en esa carpeta, se navega con <code>hjkl</code> y se cierra con <code>esc</code>. Escribir en el overlay filtra el árbol, así que tampoco hace falta un finder de archivos aparte.`,
  pros:['La más silenciosa: las carpetas solo ocupan pantalla cuando las pides.','La miga dice dónde vive la nota sin un panel (y reemplaza la ruta que A tenía arriba a la derecha).','El overlay reusa el picker: mismo <code>esc</code>, mismos <code>ctrl-v</code>/<code>ctrl-s</code>.'],
  cons:['No hay vista persistente de carpetas: reorganizar archivos (mover varios) en un overlay es incómodo.','Dos caminos a las carpetas (miga y overlay) que hay que enseñar.','Un picker con árbol (plegar y desplegar) es un tipo de picker nuevo: hoy es una lista plana.'],
  cost:`<b>Bajo-medio.</b> La miga es una fila de <code>div</code> con <code>on_click</code> sobre la ruta relativa. El overlay es un <code>PickerState</code> nuevo cuyas filas son el árbol de carpetas aplanado (nivel y abierto/cerrado), pintado con <code>deferred(anchored())</code> como el picker de hoy. Lo nuevo de verdad: <code>h</code>/<code>l</code> para plegar dentro del picker y filtrar sin perder la jerarquía (mostrar los ancestros de cada coincidencia).`},
});
const RECO=`<b>A1 + los splits de D1, con la miga de A2 como cabecera de cada panel.</b> A es la base porque el día a día es escribir una nota, y A1 casi no cuesta: hace visible la <code>T</code> que ya existe sin agregar paneles. Cuando necesitas dos notas, el split de D1 es vim puro (<code>ctrl-w v</code>), sin pestañas ni docks; cada panel necesita decir qué archivo es, y la miga de A2 hace ese trabajo y de paso navega carpetas. La lista de D se queda como columna que se invoca (<code>space l</code>) para vaciar el buzón, y el panel de contexto de D2 puede llegar después, cuando exista el grafo local.`;

/* ===================================================================
   montaje
   =================================================================== */
const S={d:'A',t:'oscuro',s:'editor'};
function readHash(){const p=new URLSearchParams(location.hash.slice(1)); if(DIRS[p.get('d')])S.d=p.get('d'); if(['oscuro','claro'].includes(p.get('t')))S.t=p.get('t'); if(['editor','finder','grafo','carpetas'].includes(p.get('s')))S.s=p.get('s');}
function writeHash(){history.replaceState(null,'',`#d=${S.d}&t=${S.t}&s=${S.s}`)}
function seg(id,items,key){
  const el=document.getElementById(id); el.querySelectorAll('button').forEach(b=>b.remove());
  items.forEach(([v,label,k])=>{const b=document.createElement('button'); b.innerHTML=label+(k?`<kbd>${k}</kbd>`:''); if(S[key]===v)b.className='on'; b.onclick=()=>{S[key]=v;draw()}; el.appendChild(b);});
}
function draw(){
  writeHash();
  document.body.className='pg-'+S.t;
  seg('segD',[['A','A · Silencio','1'],['B','B · Taller','2'],['C','C · Constelación','3'],['D','D · Bandeja','4'],['D1','D1 · split','5'],['D2','D2 · contexto','6'],['A1','A1 · tags/carpetas','7'],['A2','A2 · migas','8']],'d');
  seg('segT',[['oscuro','Oscuro'],['claro','Claro']],'t');
  seg('segS',[['editor','Editor','e'],['finder','Finder <span class="mono">space f</span>','f'],['grafo','Grafo','g'],['carpetas','Carpetas','c']],'s');
  const D=DIRS[S.d];
  document.getElementById('segS').style.display=D.variant?'none':'';
  const top=document.getElementById('top'), st=document.getElementById('stage');
  if(innerWidth>860) st.style.height=`calc(100vh - ${top.offsetHeight}px)`; else st.style.height='';
  GSLOTS.length=0;
  st.innerHTML=`<div class="app dir-${D.base||S.d} th-${S.t}">${D.render(S.s)}</div>`;
  st.querySelectorAll('.gslot').forEach(el=>{const o=GSLOTS[+el.dataset.g]; const r=el.getBoundingClientRect(); const w=Math.round(r.width)||o.w, h=Math.round(r.height)||o.h;
    const k=Math.min(w/o.w,h/o.h); const pad=(o.pad||[60,40]).map(v=>Math.max(14,v*Math.min(1,k*1.2)));
    el.outerHTML=graphSVG({...o,w,h,pad,measured:1});});
  const row=(k,x)=>`<tr class="${k===S.d?'cur':''}"><td><b>${DIRS[k].name}</b></td>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`;
  if(D.variant){
    const vr=(k,x)=>`<tr class="${k===S.d?'cur':''}"><td><b>${DIRS[k].name}</b></td>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`;
    document.getElementById('about').innerHTML=`
     <h2>${D.name}</h2><div class="tag">${D.sub}</div>
     <p>${D.phil}</p>
     <div class="cols"><div><h3>A favor</h3><ul>${D.pros.map(x=>`<li>${x}</li>`).join('')}</ul></div>
     <div><h3>En contra</h3><ul>${D.cons.map(x=>`<li>${x}</li>`).join('')}</ul></div>
     <div><h3>Costo en GPUI</h3><p>${D.cost}</p></div></div>
     <h3>Las cuatro variantes, lado a lado</h3>
     <table><tr><th></th><th>Resuelve</th><th>Qué se ve</th><th>A 1280</th><th>Cromo que agrega</th><th>Costo</th></tr>
     ${vr('D1',['varias notas en D','lista + dos notas lado a lado','la lista se pliega a una tira de íconos; notas de ~620 px','una cabecera de una línea por panel','medio-bajo'])}
     ${vr('D2',['varias cosas a la vez en D','lista de títulos + nota + contexto a pedido','lista en íconos; contexto en 330 px','un panel derecho, solo con <code>space b</code>','medio'])}
     ${vr('A1',['carpetas en A','nota sola; panel con Tags | Carpetas','igual que A','un segmento de dos opciones','bajo'])}
     ${vr('A2',['carpetas en A','nota sola; carpetas en la miga y en un overlay','igual que A','una línea de ruta sobre el título','bajo-medio'])}
     </table>
     <h3>Recomendación</h3><p>${RECO}</p>
     <p class="tag">Variantes de las direcciones A y D (B quedó descartada). Mismo tema, misma tipografía y mismo vault de ejemplo; la escena es fija en cada variante. Teclas <b>5–8</b>.</p>`;
    return;
  }
  document.getElementById('about').innerHTML=`
   <h2>${D.name}</h2><div class="tag">${D.sub}</div>
   <p>${D.phil}</p>
   <div class="cols"><div><h3>A favor</h3><ul>${D.pros.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div><h3>En contra</h3><ul>${D.cons.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div><h3>Costo en GPUI</h3><p>${D.cost}</p></div></div>
   <h3>Las cuatro, lado a lado</h3>
   <table><tr><th></th><th>Vista principal</th><th>Densidad</th><th>Dónde viven los tags</th><th>Backlinks</th><th>Grafo</th><th>Cumple design.md</th><th>Costo</th></tr>
   ${row('A',['la nota','baja','árbol con punto de color, vistas arriba','al pie de la nota','escena con <code>space g</code>','al pie de la letra','bajo'])}
   ${row('B',['varias notas a la vez','alta','sección del panel, con emoji/ícono y filtro','dock derecho con contexto','pestaña + mini en el dock','si los docks arrancan cerrados','medio-alto'])}
   ${row('C',['el grafo','media','leyenda con barras de conteo; el grafo mismo','al pie del cajón','vista principal','no del todo: el grafo manda, no el texto','alto'])}
   ${row('D',['una lista de notas','media-alta','fuente de la lista (vista, tag, carpeta, buzón)','modo de la lista + franja bajo la nota','el de la lista actual','sí','medio'])}
   </table>
   <h3>Qué es igual en las cuatro</h3>
   <p><b>El tema es el mismo:</b> las cuatro usan la paleta de fábrica del repo (<code>metalmind-oscuro</code> y <code>metalmind-claro</code>: fondo <code>#1c1f24</code>, acento <code>#7aa2f7</code>, los tags en los colores de esa paleta), los mismos tamaños, filas de 26 px y bordes de 1 px, Inter en la interfaz y JetBrains Mono en el editor. Lo que cambia entre ellas es la estructura: qué vista es la principal, cómo se reparte la ventana y cómo se navega. Oscuro y claro solo cambian el tema.</p>
   <p>Todas salen del mismo vault de ejemplo y respetan las decisiones de fondo: los tags son el eje y la vista por defecto del panel (05 §3), la jerarquía sale de <code>parents</code> y es un grafo (<code>gpui</code> aparece bajo Rust y bajo ui), el buzón es «Sin tags» al final (06 §9), las vistas guardadas son consultas de tags con nombre (06 §10), el focus siempre está escrito en la barra de estado (05 §3), no hay vista previa aparte sino live preview en el mismo editor: la línea del cursor muestra la fuente y las demás el resultado (06 §14), y nada de esto es una base de datos: la «vista del tag» de B es la página <code>tags/gpui.md</code> más su lista de notas. Cambia el <b>Tema</b> arriba para ver el claro; <b>Escena</b> muestra el finder con <code>#rust -#archivado render</code>, el grafo y la vista de carpetas de cada dirección.</p>`;
}
readHash(); draw();
addEventListener('hashchange',()=>{readHash();draw()});
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(draw,150)});
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const m={'1':['d','A'],'2':['d','B'],'3':['d','C'],'4':['d','D'],'5':['d','D1'],'6':['d','D2'],'7':['d','A1'],'8':['d','A2'],e:['s','editor'],f:['s','finder'],g:['s','grafo'],c:['s','carpetas']};
  if(e.key==='t'){S.t=S.t==='oscuro'?'claro':'oscuro';draw();return}
  if(m[e.key]){S[m[e.key][0]]=m[e.key][1];draw()}
});
