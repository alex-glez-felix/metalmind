# metalmind-claro: el tema claro, con el mismo esquema que metalmind-oscuro.

palette:
  bg: "#f5f6f8"
  bg_dark: "#e6e8ec"
  bg_highlight: "#eceef2"
  fg: "#2b2f36"
  fg_dim: "#5f6670"
  fg_faint: "#a0a6b0"
  border: "#d2d6dc"
  blue: "#2e5cd6"
  cyan: "#0f7a99"
  green: "#3f7a1e"
  magenta: "#8a3fc4"
  orange: "#b35a00"
  yellow: "#8f6400"
  red: "#c4304f"
  comment: "#8a909a"

# Los colores por su papel; `ui`, `cursor` y `syntax` los nombran como a un
# color de la paleta.
roles:
  background: bg
  surface: bg_dark
  raised: bg_highlight
  text: fg
  text_muted: fg_dim
  text_faint: fg_faint
  text_inactive: comment
  accent: blue
  border_subtle: border
  border_strong: comment
  danger: red
  warning: yellow

ui:
  background: background
  foreground: text
  selection: { color: accent, alpha: 0.2 }
  search: { color: yellow, alpha: 0.3 }
  search_current: { color: orange, alpha: 0.5 }
  current_line: raised
  gutter: background
  gutter_foreground: text_faint
  gutter_current: text
  gutter_mark: magenta
  status_background: surface
  status_foreground: text_muted
  status_unfocused_foreground: text_inactive
  status_border: border_subtle
  pane_border: border_strong
  modified: warning
  error: danger
  picker_background: surface
  picker_border: border_subtle
  picker_selected: { color: accent, alpha: 0.12 }
  picker_hover: { color: text, alpha: 0.05 }
  picker_match: accent
  picker_muted: text_muted
  panel_background: surface
  panel_foreground: text
  panel_muted: text_muted
  panel_selection: { color: accent, alpha: 0.2 }
  panel_selection_unfocused: { color: text_muted, alpha: 0.6 }
  panel_active: { color: text, alpha: 0.07 }
  panel_hover: raised
  panel_border: border_subtle
  panel_folder: accent
  panel_note: text_muted
  panel_match: orange
  menu_background: background
  menu_border: border_subtle
  menu_hover: { color: accent, alpha: 0.15 }

cursor:
  normal: { color: blue, alpha: 0.4 }
  insert: blue
  visual: { color: magenta, alpha: 0.4 }
  replace: { color: red, alpha: 0.4 }
  unfocused: { color: fg_dim, alpha: 0.35 }

syntax:
  heading: fg
  bold: fg
  italic: fg
  link: cyan
  link_unresolved: orange
  embed: magenta
  tag: green
  code: orange
  code_background: bg_dark
  code_block_background: bg_highlight
  quote: fg_dim
  list_marker: blue
  checkbox: blue
  task_done: comment
  highlight: { color: yellow, alpha: 0.25 }
  comment: comment
  frontmatter: fg_dim
  frontmatter_key: blue
  block_id: fg_faint
  fence_info: fg_dim
  code_keyword: magenta
  code_string: green
  code_number: orange
  code_comment: comment
  markup: fg_faint

headings:
  h1: { size: 1.6, weight: 700 }
  h2: { size: 1.4, weight: 700 }
  h3: { size: 1.25, weight: 700 }
  h4: { size: 1.1, weight: 700 }
  h5: { size: 1.0, weight: 700 }
  h6: { size: 1.0, weight: 600 }

# Escala de espaciado, en píxeles (base 4). `rows` y `layout` usan estos
# nombres o un número de píxeles.
spacing:
  xs: 4
  sm: 8
  md: 12
  lg: 16

radius:
  sm: 2
  md: 4
  lg: 8

# Anchos de línea, en píxeles.
stroke:
  border: 1
  caret: 2
  text_line: 1

# Tamaño (veces `font.size` de config.yaml) e interlineado (veces el tamaño).
text:
  editor: { size: 1.0, line_height: 1.4 }
  ui_md: { size: 1.0, line_height: 1.4 }
  ui_sm: { size: 1.0, line_height: 1.4 }
  normal: 400
  strong: 700

rows:
  tree: 1.7            # veces la fuente, redondeado
  menu: 1.7
  picker_padding: 6    # arriba y abajo de la línea de texto

layout:
  status_padding_x: 10
  status_padding_y: 3
  status_gap: lg
  picker_width: 640
  picker_top: 64
  picker_rows: 12
  picker_padding_x: md
  picker_input_padding_y: md
  picker_gap: lg
  picker_detail_share: 0.4  # fracción de la fila que se queda el detalle si el texto no cabe
  panel_padding_x: sm
  panel_padding_y: 6
  panel_gap: 6
  panel_indent: 14
  panel_button_padding_x: xs
  icon_size: 0.8       # veces la fuente, redondeado
  rail_width: 36
  rail_button_size: 28
  menu_width: 240
  menu_padding: xs
  menu_item_padding_x: sm
  tooltip_padding_x: sm
  tooltip_padding_y: xs
  gutter_mark_columns: 3  # la letra, el + de las demás y un espacio
