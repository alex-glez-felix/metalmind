# metalmind-oscuro: el tema por defecto.
#
# Un tema es una paleta con nombres y los colores semánticos que usa la UI.
# Cada color semántico es un `"#rrggbb"` (con comillas: sin ellas, `#` empieza
# un comentario), un nombre de la paleta o
# `{ color: <hex o nombre>, alpha: 0.0–1.0 }`.

palette:
  bg: "#1c1f24"
  bg_dark: "#16181d"
  bg_highlight: "#21252b"
  fg: "#d7dae0"
  fg_dim: "#9aa0a6"
  fg_faint: "#4b5263"
  border: "#2a2e36"
  blue: "#7aa2f7"
  cyan: "#7dcfff"
  green: "#9ece6a"
  magenta: "#bb9af7"
  orange: "#ff9e64"
  yellow: "#e0af68"
  red: "#f7768e"
  comment: "#5c6370"

ui:
  background: bg
  foreground: fg
  selection: { color: blue, alpha: 0.3 }
  search: { color: yellow, alpha: 0.3 }
  search_current: { color: orange, alpha: 0.6 }
  current_line: bg_highlight
  gutter: bg
  gutter_foreground: fg_faint
  gutter_current: fg
  status_background: bg_dark
  status_foreground: fg_dim
  status_unfocused_foreground: comment
  status_border: border
  pane_border: comment
  modified: yellow
  error: red
  picker_background: bg_dark
  picker_border: border
  picker_selected: { color: blue, alpha: 0.2 }
  picker_hover: { color: fg, alpha: 0.06 }
  picker_match: blue
  picker_muted: fg_dim
  panel_background: bg_dark
  panel_foreground: fg
  panel_muted: fg_dim
  panel_selection: { color: blue, alpha: 0.3 }
  panel_selection_unfocused: { color: fg_dim, alpha: 0.6 }
  panel_active: { color: fg, alpha: 0.08 }
  panel_hover: bg_highlight
  panel_border: border
  panel_folder: blue
  panel_note: fg_dim
  panel_match: orange
  menu_background: bg_highlight
  menu_border: comment
  menu_hover: { color: blue, alpha: 0.25 }

cursor:
  # El bloque deja ver el carácter que tapa.
  normal: { color: blue, alpha: 0.5 }
  insert: blue
  visual: { color: magenta, alpha: 0.5 }
  replace: { color: red, alpha: 0.5 }
  unfocused: { color: fg_dim, alpha: 0.35 }

syntax:
  heading: fg
  bold: fg
  italic: fg
  link: cyan
  link_unresolved: orange
  embed: magenta
  tag: green
  code: yellow
  code_background: bg_highlight
  code_block_background: bg_dark
  quote: fg_dim
  list_marker: blue
  checkbox: blue
  task_done: comment
  highlight: { color: yellow, alpha: 0.3 }
  comment: comment
  frontmatter: fg_dim
  frontmatter_key: blue
  block_id: fg_faint
  fence_info: fg_dim
  code_keyword: magenta
  code_string: green
  code_number: orange
  code_comment: comment
  # Los marcadores de la sintaxis (`**`, `#`, `[[`): se ven, atenuados.
  markup: fg_faint

# Cada nivel de heading: cuántas veces la fuente del editor y su peso
# (400 normal, 700 negrita).
headings:
  h1: { size: 1.6, weight: 700 }
  h2: { size: 1.4, weight: 700 }
  h3: { size: 1.25, weight: 700 }
  h4: { size: 1.1, weight: 700 }
  h5: { size: 1.0, weight: 700 }
  h6: { size: 1.0, weight: 600 }
