# metalmind-oscuro: el tema por defecto.
#
# Un tema es una paleta con nombres y los colores semánticos que usa la UI.
# Cada color semántico es un `"#rrggbb"` (con comillas: sin ellas, `#` empieza
# un comentario), un nombre de la paleta o
# `{ color: <hex o nombre>, alpha: 0.0–1.0 }`.

palette:
  bg: "#1c1f24"
  bg_dark: "#16181d"
  bg_highlight: "#21252b"
  fg: "#d7dae0"
  fg_dim: "#9aa0a6"
  fg_faint: "#4b5263"
  border: "#2a2e36"
  blue: "#7aa2f7"
  cyan: "#7dcfff"
  green: "#9ece6a"
  magenta: "#bb9af7"
  orange: "#ff9e64"
  yellow: "#e0af68"
  red: "#f7768e"
  comment: "#5c6370"

# Los colores por su papel; `ui`, `cursor` y `syntax` los nombran como a un
# color de la paleta.
roles:
  background: bg
  surface: bg_dark
  raised: bg_highlight
  text: fg
  text_muted: fg_dim
  text_faint: fg_faint
  text_inactive: comment
  accent: blue
  border_subtle: border
  border_strong: comment
  danger: red
  warning: yellow

ui:
  background: background
  foreground: text
  selection: { color: accent, alpha: 0.3 }
  search: { color: yellow, alpha: 0.3 }
  search_current: { color: orange, alpha: 0.6 }
  current_line: raised
  gutter: background
  gutter_foreground: text_faint
  gutter_current: text
  gutter_mark: magenta
  status_background: surface
  status_foreground: text_muted
  status_unfocused_foreground: text_inactive
  status_border: border_subtle
  pane_border: border_strong
  modified: warning
  status_saved: text_inactive
  status_unsaved: warning
  status_changed_on_disk: danger
  error: danger
  picker_background: surface
  picker_border: border_subtle
  picker_selected: { color: accent, alpha: 0.2 }
  picker_hover: { color: text, alpha: 0.06 }
  picker_match: accent
  picker_warning: warning
  picker_muted: text_muted
  panel_background: surface
  panel_foreground: text
  panel_muted: text_muted
  panel_selection: { color: accent, alpha: 0.3 }
  panel_selection_unfocused: { color: text_muted, alpha: 0.6 }
  panel_active: { color: text, alpha: 0.08 }
  panel_hover: raised
  panel_border: border_subtle
  panel_folder: accent
  panel_note: text_muted
  panel_match: orange
  menu_background: raised
  menu_border: border_strong
  menu_hover: { color: accent, alpha: 0.25 }

cursor:
  # El bloque deja ver el carácter que tapa.
  normal: { color: blue, alpha: 0.5 }
  insert: blue
  visual: { color: magenta, alpha: 0.5 }
  replace: { color: red, alpha: 0.5 }
  unfocused: { color: fg_dim, alpha: 0.35 }

syntax:
  heading: fg
  bold: fg
  italic: fg
  link: cyan
  link_unresolved: orange
  embed: magenta
  tag: green
  code: yellow
  code_background: bg_highlight
  code_block_background: bg_dark
  quote: fg_dim
  list_marker: blue
  checkbox: blue
  task_done: comment
  highlight: { color: yellow, alpha: 0.3 }
  comment: comment
  frontmatter: fg_dim
  frontmatter_key: blue
  block_id: fg_faint
  fence_info: fg_dim
  code_keyword: magenta
  code_string: green
  code_number: orange
  code_comment: comment
  # El LaTeX de una fórmula con el cursor encima; la fórmula compuesta va
  # en `ui.foreground` y una que no compone, en `ui.error`.
  math: blue
  # Los marcadores de la sintaxis (`**`, `#`, `[[`): se ven, atenuados.
  markup: fg_faint

# Cada nivel de heading: cuántas veces la fuente del editor y su peso
# (400 normal, 700 negrita).
headings:
  h1: { size: 1.6, weight: 700 }
  h2: { size: 1.4, weight: 700 }
  h3: { size: 1.25, weight: 700 }
  h4: { size: 1.1, weight: 700 }
  h5: { size: 1.0, weight: 700 }
  h6: { size: 1.0, weight: 600 }

# Escala de espaciado, en píxeles (base 4). `rows` y `layout` usan estos
# nombres o un número de píxeles.
spacing:
  xs: 4
  sm: 8
  md: 12
  lg: 16

radius:
  sm: 2
  md: 4
  lg: 8

# Anchos de línea, en píxeles.
stroke:
  border: 1
  caret: 2
  text_line: 1

# Tamaño (veces `font.size` de config.yaml) e interlineado (veces el tamaño).
text:
  editor: { size: 1.0, line_height: 1.4 }
  ui_md: { size: 1.0, line_height: 1.4 }
  ui_sm: { size: 1.0, line_height: 1.4 }
  math: 1.21           # las fórmulas, veces el texto de las notas
  normal: 400
  strong: 700

rows:
  tree: 1.7            # veces la fuente, redondeado
  menu: 1.7
  picker_padding: 6    # arriba y abajo de la línea de texto

layout:
  status_padding_x: 10
  status_padding_y: 3
  status_gap: lg
  status_message_max_width: 0.5  # entre el modo y la posición; el nombre se recorta antes
  picker_width: 640
  picker_top: 64
  picker_rows: 12
  picker_padding_x: md
  picker_input_padding_y: md
  picker_gap: lg
  picker_detail_share: 0.4  # fracción de la fila que se queda el detalle si el texto no cabe
  panel_padding_x: sm
  panel_padding_y: 6
  panel_gap: 6
  panel_indent: 14
  panel_button_padding_x: xs
  icon_size: 0.8       # veces la fuente, redondeado
  rail_width: 36
  rail_button_size: 28
  menu_width: 240
  menu_padding: xs
  menu_item_padding_x: sm
  completion_rows: 8
  tooltip_padding_x: sm
  tooltip_padding_y: xs
  gutter_mark_columns: 3  # la letra, el + de las demás y un espacio
  math_padding: 1
  math_block_margin: xs
