# metalmind-oscuro: el tema por defecto.
#
# Un tema es una paleta con nombres y los colores semánticos que usa la UI.
# Cada color semántico es un `"#rrggbb"` (con comillas: sin ellas, `#` empieza
# un comentario), un nombre de la paleta o
# `{ color: <hex o nombre>, alpha: 0.0–1.0 }`.

palette:
  bg: "#1c1f24"
  bg_dark: "#16181d"
  bg_highlight: "#21252b"
  fg: "#d7dae0"
  fg_dim: "#9aa0a6"
  fg_faint: "#4b5263"
  border: "#2a2e36"
  blue: "#7aa2f7"
  cyan: "#7dcfff"
  green: "#9ece6a"
  magenta: "#bb9af7"
  orange: "#ff9e64"
  yellow: "#e0af68"
  red: "#f7768e"
  comment: "#5c6370"

# Los colores por su papel; `ui`, `cursor` y `syntax` los nombran como a un
# color de la paleta.
roles:
  background: bg
  surface: bg_dark
  raised: bg_highlight
  text: fg
  text_muted: fg_dim
  text_faint: fg_faint
  text_inactive: comment
  accent: blue
  border_subtle: border
  border_strong: comment
  danger: red
  warning: yellow

ui:
  background: background
  foreground: text
  selection: { color: accent, alpha: 0.3 }
  search: { color: yellow, alpha: 0.3 }
  search_current: { color: orange, alpha: 0.6 }
  current_line: raised
  gutter: background
  gutter_foreground: text_faint
  gutter_current: text
  gutter_mark: magenta
  status_background: surface
  status_foreground: text_muted
  status_unfocused_foreground: text_inactive
  status_border: border_subtle
  pane_border: border_strong
  pane_header_foreground: text
  pane_header_folder: text_muted
  pane_header_unfocused: text_inactive
  pane_header_focus: accent
  pane_header_hover: { color: text, alpha: 0.06 }
  pane_header_border: border_subtle
  modified: warning
  status_saved: text_inactive
  status_unsaved: warning
  status_changed_on_disk: danger
  error: danger
  picker_background: surface
  picker_border: border_subtle
  picker_selected: { color: accent, alpha: 0.2 }
  picker_hover: { color: text, alpha: 0.06 }
  picker_match: accent
  picker_warning: warning
  picker_muted: text_muted
  focus_indicator: accent
  panel_background: surface
  panel_foreground: text
  panel_muted: text_muted
  panel_selection: { color: accent, alpha: 0.3 }
  panel_selection_unfocused: { color: text_muted, alpha: 0.6 }
  panel_active: { color: text, alpha: 0.08 }
  panel_hover: raised
  panel_border: border_subtle
  panel_folder: accent
  panel_note: text_muted
  panel_tab: accent
  panel_match: orange
  menu_background: raised
  menu_border: border_strong
  menu_hover: { color: accent, alpha: 0.25 }
  toast_background: surface
  toast_border: border_strong
  toast_info: accent
  toast_warning: warning
  toast_error: danger
  toast_hint: text_muted
  toast_button_hover: { color: text, alpha: 0.06 }
  which_key_background: surface
  which_key_border: border_strong
  which_key_key: accent
  which_key_prefix: text_muted
  board_line: text_muted
  board_fill: { color: text, alpha: 0.04 }
  board_card: raised
  board_card_accent: accent
  board_group: { color: text, alpha: 0.05 }
  board_text: text
  board_text_muted: text_muted
  board_label_background: background
  board_selection: accent
  board_guide: accent
  board_hint_background: accent
  board_hint_text: background
  board_color_1: red
  board_color_2: orange
  board_color_3: yellow
  board_color_4: green
  board_color_5: cyan
  board_color_6: magenta

cursor:
  # El bloque deja ver el carácter que tapa.
  normal: { color: blue, alpha: 0.5 }
  insert: blue
  visual: { color: magenta, alpha: 0.5 }
  replace: { color: red, alpha: 0.5 }
  unfocused: { color: fg_dim, alpha: 0.35 }

syntax:
  heading: fg
  bold: fg
  italic: fg
  link: cyan
  link_unresolved: orange
  embed: magenta
  tag: green
  code: yellow
  code_background: bg_highlight
  code_block_background: bg_dark
  quote: fg_dim
  list_marker: blue
  checkbox: blue
  task_done: comment
  highlight: { color: yellow, alpha: 0.3 }
  comment: comment
  frontmatter: fg_dim
  frontmatter_key: blue
  block_id: fg_faint
  fence_info: fg_dim
  code_keyword: magenta
  code_string: green
  code_number: orange
  code_comment: comment
  # El LaTeX de una fórmula con el cursor encima; la fórmula compuesta va
  # en `ui.foreground` y una que no compone, en `ui.error`.
  math: blue
  # Los marcadores de la sintaxis (`**`, `#`, `[[`): se ven, atenuados.
  markup: fg_faint

# Cada nivel de heading: cuántas veces la fuente del editor y su peso
# (400 normal, 700 negrita).
headings:
  h1: { size: 1.6, weight: 700 }
  h2: { size: 1.4, weight: 700 }
  h3: { size: 1.25, weight: 700 }
  h4: { size: 1.1, weight: 700 }
  h5: { size: 1.0, weight: 700 }
  h6: { size: 1.0, weight: 600 }

# Escala de espaciado, en píxeles (base 4). `rows` y `layout` usan estos
# nombres o un número de píxeles.
spacing:
  xs: 4
  sm: 8
  md: 12
  lg: 16

radius:
  sm: 2
  md: 4
  lg: 8

# Anchos de línea, en píxeles.
stroke:
  border: 1
  caret: 2
  text_line: 1
  tab: 2  # bajo la pestaña que se ve
  board_line: 2
  board_selection: 2
  board_guide: 1

# Tamaño (veces `font.size` de config.yaml) e interlineado (veces el tamaño).
text:
  editor: { size: 1.0, line_height: 1.4 }
  ui_md: { size: 1.0, line_height: 1.4 }
  ui_sm: { size: 1.0, line_height: 1.4 }
  math: 1.21           # las fórmulas, veces el texto de las notas
  normal: 400
  strong: 700

rows:
  tree: 1.7            # veces la fuente, redondeado
  menu: 1.7
  picker_padding: 6    # arriba y abajo de la línea de texto

layout:
  status_padding_x: 10
  status_padding_y: 3
  status_gap: lg
  status_focus_max_width: 0.5  # el focus, del espacio entre el modo y la posición
  pane_header_padding_x: 10
  pane_header_padding_y: 3
  pane_header_folder_max_share: 0.5  # la carpeta de la nota, de la ruta sobre el panel
  picker_width: 640
  picker_max_share: 0.9  # lo más de la ventana que ocupa a lo ancho el picker (y la línea de `:`)
  picker_top: 64
  picker_rows: 12
  picker_padding_x: md
  picker_input_padding_y: md
  picker_gap: lg
  picker_detail_share: 0.4  # fracción de la fila que se queda el detalle si el texto no cabe
  picker_preview_width: 560  # la vista previa de `space /`, a la derecha de la lista
  picker_preview_min_width: 320  # más angosta que esto, no se muestra
  change_preview_detail_lines: 4  # el cambio elegido, entero, bajo la vista previa de un cambio en el vault
  panel_padding_x: sm
  panel_padding_y: 6
  panel_gap: 6
  panel_indent: 14
  panel_button_padding_x: xs
  icon_size: 1.0       # veces la fuente, redondeado
  rail_width: 36
  rail_button_size: 28
  list_width: 360
  list_row_padding_y: sm
  list_row_gap: 2
  list_excerpt_lines: 2
  list_open_min_width: 1600  # sin estado guardado: a 1280 arranca plegada
  context_width: 380
  menu_width: 240
  menu_padding: xs
  menu_item_padding_x: sm
  completion_rows: 8
  tooltip_padding_x: sm
  tooltip_padding_y: xs
  toast_width: 400
  toast_margin: md     # del borde de arriba y del derecho de la ventana
  toast_gap: sm        # entre toasts, y entre el ícono, el texto y la tecla
  toast_padding_x: md
  toast_padding_y: sm
  which_key_rows: 12
  which_key_margin: md   # de los bordes de abajo y derecho del panel de edición
  which_key_padding_x: md
  which_key_padding_y: sm
  which_key_gap: md      # entre la tecla y su acción, y entre columnas
  board_padding: md
  board_arrow_size: md
  board_card_accent: xs
  board_text: 16
  board_text_small: 13
  board_text_heading: 28
  board_edge_label_width: 160
  board_line_height: 1.3
  board_min_text: 3
  board_pan_step: 80
  board_fit_margin: 40
  board_toolbar_margin: sm
  board_edge_grab: 6       # lo que el ratón agarra alrededor del borde de un nodo, para una flecha
  board_corner_grab: 7     # lo que agarra alrededor de la esquina de lo elegido, para el tamaño
  board_edge_hit: 5        # lo que agarra alrededor de una flecha
  board_handle_size: 8
  board_drag_threshold: 3  # lo que se mueve el ratón antes de que un clic sea un arrastre
  board_snap_distance: 6   # a cuánto se alinea con un vecino
  board_hint_padding: xs
  board_fill_alpha: 0.14
  board_group_alpha: 0.06
  gutter_mark_columns: 3  # la letra, el + de las demás y un espacio
  note_max_width: 80      # columnas de texto; en un panel más ancho la nota se centra
  math_padding: 1
  math_block_margin: xs
