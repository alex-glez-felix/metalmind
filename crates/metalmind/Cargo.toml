[package]
name = "metalmind"
description = "Editor de notas markdown con vim, nativo para Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
dirs.workspace = true
env_logger.workspace = true
gpui-kit.workspace = true
jiff.workspace = true
log.workspace = true
metalmind-config.workspace = true
metalmind-search.workspace = true
metalmind-syntax.workspace = true
metalmind-template.workspace = true
metalmind-ui.workspace = true
metalmind-vault.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
metalmind-perf.workspace = true
png.workspace = true
pretty_assertions.workspace = true
rstest.workspace = true
tempfile.workspace = true
x11rb.workspace = true

# Necesita Xvfb y un driver Vulkan, como el smoke (ver docs/performance.md).
[[bench]]
name = "ui"
harness = false

[lints]
workspace = true

# `publish = false` es por crates.io; el binario sí se distribuye en releases.
[package.metadata.dist]
dist = true
