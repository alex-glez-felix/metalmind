name: Rendimiento

# Conteo de instrucciones con callgrind (gungraun): determinista, así que el
# ruido del runner no cuenta. Cada PR se compara contra su base medida en el
# mismo runner, no contra un número guardado: el conteo cambia con las
# extensiones del CPU (memchr y ropey eligen SIMD al arrancar), y dos runners
# de GitHub no siempre tienen el mismo. Ver docs/performance.md.

on:
  push:
    branches: [main]
    paths: &medido
      - "crates/metalmind-buffer/**"
      - "crates/metalmind-vim/**"
      - "crates/metalmind-syntax/**"
      - "crates/metalmind-search/**"
      - "crates/metalmind-vault/**"
      - "crates/metalmind-config/**"
      - "crates/metalmind-ui/**"
      - "crates/metalmind-perf/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/perf.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: *medido

env:
  CARGO_TERM_COLOR: always
  GUNGRAUN_VERSION: 0.20.0
  # Los crates con un benchmark `instrucciones`.
  PAQUETES: metalmind-perf metalmind-vault metalmind-ui
  # Una regresión de más de esto en instrucciones hace fallar el job.
  LIMITE: ir=5%
  # Con esta etiqueta, una regresión justificada se reporta sin fallar.
  ETIQUETA_ACEPTADA: rendimiento-aceptado

jobs:
  instrucciones:
    # Otras etiquetas no cambian nada; esta sí cambia el resultado.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'rendimiento-aceptado'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # En una PR, HEAD es el merge con la base y HEAD^1 es la base.
          fetch-depth: 2
      # valgrind, lo que GPUI necesita para compilar y una fuente monoespaciada
      # para el tema del editor (benchmark de metalmind-ui).
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: valgrind libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libvulkan-dev fonts-dejavu-core
          version: perf-1
      - run: valgrind --version
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # v3: desde que mide metalmind-ui, el caché lleva GPUI en release.
          prefix-key: v3-perf
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@${{ env.GUNGRAUN_VERSION }}

      # Cada crate en su propio `cargo bench`: compilados juntos, las features
      # de las dependencias compartidas se unifican con las dev-dependencies de
      # los otros (las de GPUI de metalmind-ui), y el binario del núcleo de la
      # PR no sería el mismo que el de la base aunque su código no cambie.
      - name: Medir la base
        if: github.event_name == 'pull_request'
        id: base
        run: |
          git worktree add ../base HEAD^1
          medidos=()
          for paquete in $PAQUETES; do
            if [ -f "../base/crates/$paquete/benches/instrucciones.rs" ]; then
              # El mismo target que la PR: las dependencias se compilan una vez.
              (cd ../base && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
                cargo bench -p "$paquete" --bench instrucciones -- --save-baseline=base)
              medidos+=("$paquete")
            fi
          done
          if [ ${#medidos[@]} -eq 0 ]; then
            echo "::notice::La base no tiene benchmarks de instrucciones; no hay contra qué comparar."
            exit 0
          fi
          echo "medida=true" >> "$GITHUB_OUTPUT"
          echo "paquetes=${medidos[*]}" >> "$GITHUB_OUTPUT"
          # Cargo decide si un crate del workspace está al día por fechas y con
          # rutas relativas al crate: lo que cambia la PR tiene que quedar más
          # nuevo que lo que compiló la base, o mediría el binario de la base.
          git diff --name-only -z HEAD^1 HEAD | xargs -0 -r touch -c

      - name: Comparar contra la base
        if: steps.base.outputs.medida == 'true'
        env:
          ACEPTADA: ${{ contains(github.event.pull_request.labels.*.name, 'rendimiento-aceptado') }}
          MEDIDOS: ${{ steps.base.outputs.paquetes }}
        run: |
          limite=()
          if [ "$ACEPTADA" = "true" ]; then
            echo "::warning::Etiqueta $ETIQUETA_ACEPTADA: las regresiones se reportan sin fallar."
          else
            limite=(--callgrind-limits="$LIMITE")
          fi
          # Todos corren aunque uno falle, para ver cada regresión de una vez.
          # Un crate cuyo benchmark la base no tiene solo se corre.
          fallaron=()
          for paquete in $PAQUETES; do
            comparar=()
            if [[ " $MEDIDOS " == *" $paquete "* ]]; then
              comparar=(--baseline=base "${limite[@]}")
            fi
            cargo bench -p "$paquete" --bench instrucciones -- "${comparar[@]}" \
              || fallaron+=("$paquete")
          done
          if [ ${#fallaron[@]} -gt 0 ]; then
            echo "::error::Regresiones en: ${fallaron[*]}"
            exit 1
          fi

      # En main y en una PR sin base medible: que los benchmarks corran.
      - name: Medir
        if: steps.base.outputs.medida != 'true'
        run: |
          for paquete in $PAQUETES; do
            cargo bench -p "$paquete" --bench instrucciones
          done
