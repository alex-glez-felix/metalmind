name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # La tabla de casos de vim se validó contra esta versión.
  # Debe coincidir con VERSION en crates/nota-vim/tests/support/nvim.rs.
  # El sha256 sale del campo `digest` del asset en la API de releases.
  NVIM_VERSION: v0.12.6
  NVIM_SHA256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # Lo que GPUI necesita para compilar en Linux (nota-ui y el binario).
      - name: Librerías de sistema de GPUI
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache no mete [profile] en la llave: tras el opt-level = 2 de
          # las dependencias, main seguía restaurando el caché viejo (full match,
          # sin guardar) y recompilaba ~500 crates en cada corrida. Subir este
          # prefijo cada vez que cambie un [profile] del Cargo.toml raíz.
          prefix-key: v1-rust
          # Solo main escribe; las PRs restauran el de main. Así los cachés de
          # PR (~2 GB cada uno) no se comen el tope de 10 GB del repo.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # 03 §6: solo nota-ui y el binario dependen de la GUI.
      - name: El núcleo no depende de GPUI
        run: |
          for crate in nota-buffer nota-config nota-vim nota-vault; do
            if cargo tree -p "$crate" -e normal,build | grep -q gpui; then
              echo "$crate depende de GPUI" >&2
              exit 1
            fi
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instalar neovim para el oráculo
        run: |
          curl -fsSLo nvim.tar.gz "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          echo "${NVIM_SHA256}  nvim.tar.gz" | sha256sum --check
          sudo tar -xzf nvim.tar.gz -C /opt
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      # Sin nvim los casos del oráculo se ignorarían en silencio.
      - run: nvim --version
      # Lo que GPUI necesita para compilar en Linux (nota-ui y el binario).
      - name: Librerías de sistema de GPUI
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libvulkan-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache no mete [profile] en la llave: tras el opt-level = 2 de
          # las dependencias, main seguía restaurando el caché viejo (full match,
          # sin guardar) y recompilaba ~500 crates en cada corrida. Subir este
          # prefijo cada vez que cambie un [profile] del Cargo.toml raíz.
          prefix-key: v1-rust
          # Solo main escribe; las PRs restauran el de main. Así los cachés de
          # PR (~2 GB cada uno) no se comen el tope de 10 GB del repo.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --no-tests=fail

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils libxml2-utils
      - run: desktop-file-validate packaging/linux/nota.desktop
      - run: appstreamcli validate --no-net packaging/linux/io.github.alex_glez_felix.nota.metainfo.xml
      - run: xmllint --noout packaging/linux/nota.svg
