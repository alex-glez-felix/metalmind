name: Fuzz

# Aparte del CI de las PRs: tarda y necesita nightly. Ver docs/fuzzing.md.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Segundos por target
        type: number
        default: 300

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [buffer_edits, vim_keys, vim_search_subst]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}
      # El corpus crece con cada corrida: se restaura el más reciente y se
      # guarda con una llave nueva, también si hubo un crash.
      - uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || 300 }}
        run: >
          cargo +nightly fuzz run "$TARGET" --
          -max_total_time="$SECONDS_PER_TARGET"
          -timeout=10 -rss_limit_mb=2048
      - name: Minimizar el corpus
        if: success()
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz cmin "$TARGET"
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
