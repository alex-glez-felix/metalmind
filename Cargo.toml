[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/alex-glez-felix/nota"
publish = false

[workspace.dependencies]
nota-buffer = { path = "crates/nota-buffer" }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
smallvec = "1.16.3"
thiserror = "2.0.21"
proptest = "1.12.0"
rstest = "0.27.0"
rstest_reuse = "0.7.0"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
