[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/alex-glez-felix/nota"
publish = false

[workspace.dependencies]
nota-buffer = { path = "crates/nota-buffer" }
nota-config = { path = "crates/nota-config" }
nota-perf = { path = "crates/nota-perf" }
nota-search = { path = "crates/nota-search" }
nota-syntax = { path = "crates/nota-syntax" }
nota-ui = { path = "crates/nota-ui" }
nota-vault = { path = "crates/nota-vault" }
nota-vim = { path = "crates/nota-vim" }
anyhow = "1.0.104"
arc-swap = "1.9.2"
async-channel = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11.11"
# Fijado con `=`: gpui-pre cambia cada semana (04 §riesgo 9). Sin gpui-component
# ni sus assets: el editor es propio y no usa el `Root` de gpui-kit (04 §riesgo 1).
gpui-kit = { version = "=0.7.3", default-features = false }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
log = "0.4.34"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
nucleo-matcher = "0.3.1"
regex = "1.13.1"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
# Ya entra por tempfile; aquí por `renameat` con RENAME_NOREPLACE, sin unsafe.
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
serde_ignored = "0.1.14"
smallvec = "1.16.3"
thiserror = "2.0.21"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
unicode-segmentation = "1.13.3"
divan = "0.1.21"
gungraun = "0.20.0"
insta = { version = "1.49.0", features = ["glob"] }
proptest = "1.12.0"
rstest = "0.27.0"
rstest_reuse = "0.7.0"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
# El harness de `crates/nota/tests` teclea con XTest; GPUI ya trae esta versión.
x11rb = { version = "0.13.2", features = ["xtest"] }

# Dependencias optimizadas en debug: GPUI sin optimizar no da los fps del spike.
# Solo pesa en el build limpio; los crates propios siguen en opt-level 0.
[profile.dev.package."*"]
opt-level = 2

# Perfil de los binarios del release (dist).
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
