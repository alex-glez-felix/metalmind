[profile.default]
# Un test que se cuelga falla al minuto.
slow-timeout = { period = "30s", terminate-after = 2 }

# Las pruebas de complejidad cuentan instrucciones con callgrind, que corre
# ~50 veces más lento, en dos procesos a la vez (N y 16N): ocupan dos hilos.
# Corren en paralelo porque contar no depende de la CPU que queda
# (docs/performance.md). La más lenta tarda hoy ~110 s en el CI; una que se
# volvió cuadrática (×16 más trabajo con 16N) falla por tiempo a los 10 min.
[[profile.default.overrides]]
filter = 'binary(complexity) | test(/::complexity::|_lineal$|^growth::tests::/)'
threads-required = 2
slow-timeout = { period = "120s", terminate-after = 5 }

# Cada caso de las capturas recorre todas las escenas en una ventana:
# crece con cada escena nueva y en 1920x1080 ya ronda el minuto.
[[profile.default.overrides]]
filter = 'binary(capturas)'
slow-timeout = { period = "60s", terminate-after = 3 }
